[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkcode-python-service"
version = "0.1.0"
description = "Python capability service for zkcode"
license = "Apache-2.0"
authors = [{name = "zkcode contributors"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "rich>=13.0.0",
]
code-intel = [
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.10.0,<2.0.0",
    "rope>=1.13.0",
    "jedi>=0.19.0",
]
file-processing = [
    "chardet>=5.2.0",
    "python-magic>=0.4.27",
    "watchfiles>=1.0.0",
]
code-quality = [
    "radon>=6.0.1",
    "pygount>=1.8.0",
]
analysis = [
    "libcst>=1.1.0",
    "networkx>=3.2",
    "httpx>=0.27.0",
]
git-enhanced = [
    "GitPython>=3.1.43",
]
browser = [
    "playwright>=1.49.0",
]
http-api = [
    "jsonpath-ng>=1.7.0",
]
tokenization = [
    "tiktoken>=0.12.0,<0.13.0",
]
full = [
    "zkcode-python-service[cli,code-intel,file-processing,code-quality,analysis,git-enhanced,browser,http-api,tokenization]",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
]

[project.scripts]
zkcode = "cli.main:app"

[project.urls]
Homepage = "https://github.com/zhikunqingtao/zkcode"
Repository = "https://github.com/zhikunqingtao/zkcode"
Issues = "https://github.com/zhikunqingtao/zkcode/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]

[tool.pytest.ini_options]
# Task 3-5 差异化升级测试覆盖率配置（§11.4）
# 用法：pytest --cov=src --cov-fail-under=70 --cov-report=html:../docs/test-results/coverage/python-html
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
