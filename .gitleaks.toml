title = "zkcode secret scanning"

[extend]
useDefault = true

[[rules]]
id = "dashscope-token-plan-api-key"
description = "DashScope token-plan API key"
regex = '''sk-sp-[A-Za-z0-9._-]{35,}'''
keywords = ["sk-sp-"]

[allowlist]
description = "Generated/runtime paths, public MCP server identifiers, and the explicitly public first-run demo credential asset"
paths = [
  '''(^|/)target(?:-[^/]*)?/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.zk/''',
  '''(^|/)\.runtime/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/''',
  '''^configuration/bootstrap/demo-credentials\.db$''',
]
# DashScope publishes these identifiers as part of MCP endpoint URLs. They are
# routing names, not bearer credentials. Keep the exception exact so API keys
# elsewhere in the same registry remain subject to the default rules.
regexes = [
  '''^market-cmgjmcp[0-9]{8}$''',
]
