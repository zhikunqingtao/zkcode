name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: REST / WebSocket / Tool / SQLite contracts
        run: ./scripts/parity/check-contracts.sh
      - name: Source bootstrap unit tests
        run: python -m unittest discover -s scripts/dev/tests -v

  source-bootstrap:
    name: Source bootstrap
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/playwright
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-service/requirements.lock
            python-service/build-requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Synchronize the source environment through the public entry core
        run: ./dev sync --build
      - name: Verify synchronized components and real Headless Shell
        run: ./dev doctor --deep --json

  rust:
    name: Rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Server version smoke
        run: ./target/release/zk-server --version

  frontend:
    name: Frontend
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Official npm vulnerability gate
        run: ../scripts/parity/npm-audit.sh

  python:
    name: Python 3.11
    runs-on: macos-15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/playwright
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-service/requirements.lock
            python-service/build-requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r build-requirements.lock
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e '.[full,test]'
          python -m playwright install --only-shell chromium
          python -m pip check
      - name: Test with coverage
        run: python -m pytest --cov=src --cov-fail-under=70

  supply-chain:
    name: Supply chain
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - name: Rust dependency policy
        run: cargo deny check
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
